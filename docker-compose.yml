services:
  api:
    build: .
    image: gate-assignment-optimizer:latest
    ports:
      # Host side bound to localhost only. Change the host port with API_PORT=8010.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - jobs-data:/data
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      # python:slim has no curl, so use Python's urllib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    image: gate-assignment-optimizer:latest
    command: ["python", "-m", "app.worker"]
    volumes:
      - jobs-data:/data
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # The worker stops between jobs; give a running solve some time to finish.
    # If it is killed mid-solve, the job is requeued when the worker starts again.
    stop_grace_period: 30s
    restart: unless-stopped
    # v1 runs exactly one worker: requeue-on-start assumes no other worker is running.

volumes:
  # Shared by api (writes jobs) and worker (writes results): one SQLite file.
  jobs-data:
