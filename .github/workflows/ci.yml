name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags (no floating "v10").
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true

      # Installs Python 3.12 (.python-version) and the exact versions in uv.lock.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest --durations=5

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag gate-assignment-optimizer:ci .

      - name: Check Prometheus config and alert rules
        run: >
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro"
          --entrypoint promtool prom/prometheus:v3.16.0
          check config /etc/prometheus/prometheus.yml
